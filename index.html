const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const abilityMod = (score) => Math.floor((Number(score) - 10) / 2);
const fmtMod = (n) => (n >= 0 ? `+${n}` : `${n}`);
const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

// 5e-standard HP application: damage hits temp HP first, then current HP.
// Healing restores current HP up to max and never touches/creates temp HP.
function applyHpDelta(hp, amount) {
  if (amount === 0 || !amount) return hp;
  if (amount < 0) {
    let dmg = -amount;
    const temp = hp.temp || 0;
    const tempAfter = Math.max(0, temp - dmg);
    const dmgLeftover = Math.max(0, dmg - temp);
    const current = clamp(hp.current - dmgLeftover, 0, hp.max);
    return { ...hp, current, temp: tempAfter };
  }
  const current = clamp(hp.current + amount, 0, hp.max);
  return { ...hp, current };
}

// Deep-clones a character and regenerates every nested id so duplicates
// never collide with the original (actions, items, powers, resource pools,
// custom fields/tabs, custom stats all get fresh ids).
function cloneCharacterWithFreshIds(character) {
  const clone = JSON.parse(JSON.stringify(character));
  const idArrayKeys = ['actions', 'resourcePools', 'items', 'homebrewPowers', 'customFields', 'customTabs', 'customStats'];
  idArrayKeys.forEach((key) => {
    if (Array.isArray(clone[key])) {
      clone[key] = clone[key].map((item) => ({ ...item, id: uid() }));
    }
  });
  clone.id = uid();
  clone.lastEdited = Date.now();
  return clone;
}

const isPlainObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
const asString = (v, fallback = '') => (typeof v === 'string' ? v : fallback);
const asNumber = (v, fallback = 0) => (typeof v === 'number' && !Number.isNaN(v) ? v : fallback);
const asBool = (v, fallback = false) => (typeof v === 'boolean' ? v : fallback);
const asStringArray = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === 'string') : []);

// Normalizes a raw imported object (hand-written or AI-generated) into a
// valid character shape. Every field is individually type-checked and
// coerced to a safe default rather than trusting the input's shape — this
// is what makes AI-generated JSON safe to import even when a field is
// missing, misnamed, or the wrong type (a string HP instead of an object,
// actions given as plain strings, etc.).
function normalizeImportedCharacter(raw) {
  const blank = createBlankCharacter();
  if (!isPlainObject(raw)) return blank;

  const abilities = { ...blank.abilities };
  if (isPlainObject(raw.abilities)) {
    ABILITIES.forEach((ab) => { abilities[ab] = asNumber(raw.abilities[ab], 10); });
  }

  const hp = { ...blank.hp };
  if (isPlainObject(raw.hp)) {
    hp.max = Math.max(1, asNumber(raw.hp.max, 10));
    hp.current = clamp(asNumber(raw.hp.current, hp.max), 0, hp.max);
    hp.temp = Math.max(0, asNumber(raw.hp.temp, 0));
  }

  const normalizeIdArray = (arr, shapeFn) =>
    Array.isArray(arr) ? arr.filter(isPlainObject).map((item) => ({ id: uid(), ...shapeFn(item) })) : [];

  const senses = { ...blank.senses };
  if (isPlainObject(raw.senses)) {
    senses.passivePerception = asNumber(raw.senses.passivePerception, 10);
    senses.darkvision = asNumber(raw.senses.darkvision, 0);
    senses.custom = '';
    // Accept customSenses as either objects [{name: "..."}] or a bare array
    // of strings (an AI is likely to produce the simpler shape) — both
    // normalize to the same internal list.
    if (Array.isArray(raw.senses.customSenses)) {
      senses.customSenses = raw.senses.customSenses
        .map((s) => (typeof s === 'string' ? { name: s } : isPlainObject(s) ? { name: asString(s.name) } : null))
        .filter((s) => s && s.name)
        .map((s) => ({ id: uid(), ...s }));
    } else if (asString(raw.senses.custom)) {
      senses.customSenses = [{ id: uid(), name: raw.senses.custom }];
    }
  }

  return {
    ...blank,
    id: uid(),
    name: asString(raw.name, blank.name) || blank.name,
    subtitle: asString(raw.subtitle),
    role: asString(raw.role),
    icon: ICON_NAMES.includes(raw.icon) ? raw.icon : blank.icon,
    portraitUrl: '', // never imported from JSON — portraits are uploaded, not scripted
    tags: asStringArray(raw.tags),
    lastEdited: Date.now(),
    hp,
    ac: asNumber(raw.ac, blank.ac),
    speed: asString(raw.speed, blank.speed),
    initiativeMod: asNumber(raw.initiativeMod, 0),
    proficiencyBonus: asNumber(raw.proficiencyBonus, 2),
    abilities,
    saveProficiencies: asStringArray(raw.saveProficiencies).filter((a) => ABILITIES.includes(a)),
    skillProficiencies: asStringArray(raw.skillProficiencies).filter((s) => SKILLS.some((sk) => sk.key === s)),
    skillExpertise: (() => {
      const profs = new Set(asStringArray(raw.skillProficiencies).filter((s) => SKILLS.some((sk) => sk.key === s)));
      return asStringArray(raw.skillExpertise).filter((s) => SKILLS.some((sk) => sk.key === s) && profs.has(s));
    })(),
    skillOverrides: isPlainObject(raw.skillOverrides)
      ? Object.fromEntries(
          Object.entries(raw.skillOverrides)
            .filter(([key, v]) => SKILLS.some((sk) => sk.key === key) && typeof v === 'number' && !Number.isNaN(v))
        )
      : {},
    customStats: normalizeIdArray(raw.customStats, (s) => ({ label: asString(s.label, 'Stat'), value: asString(s.value, String(s.value ?? '')) })),
    conditions: asStringArray(raw.conditions),
    vulnerabilities: asStringArray(raw.vulnerabilities),
    resistances: asStringArray(raw.resistances),
    immunities: asStringArray(raw.immunities),
    conditionImmunities: asStringArray(raw.conditionImmunities),
    senses,
    actions: normalizeIdArray(raw.actions, (a) => ({
      category: ACTION_CATEGORIES.includes(a.category) ? a.category : 'action',
      name: asString(a.name, 'Action'),
      cost: asString(a.cost),
      description: asString(a.description),
      // Schema v2: all fields below are optional. Keeping them absent is
      // intentional for old files and description-only homebrew actions.
      ...(asString(a.attackFormula) ? { attackFormula: a.attackFormula } : {}),
      ...(Array.isArray(a.damageFormulas) ? {
        damageFormulas: a.damageFormulas
          .filter(isPlainObject)
          .map((d) => ({ formula: asString(d.formula), type: asString(d.type) }))
          .filter((d) => d.formula)
      } : {}),
      ...(asString(a.healingFormula) ? { healingFormula: a.healingFormula } : {}),
      ...(asString(a.saveAbility) ? { saveAbility: a.saveAbility } : {}),
      ...(typeof a.saveDc === 'number' ? { saveDc: a.saveDc } : {}),
      ...(Array.isArray(a.resourceCosts) ? { resourceCosts: a.resourceCosts.filter(isPlainObject) } : {}),
      ...(asString(a.range) ? { range: a.range } : {}),
      ...(isPlainObject(a.area) ? { area: a.area } : {}),
      ...(asString(a.targetType) ? { targetType: a.targetType } : {}),
      ...(Array.isArray(a.effects) ? { effects: a.effects.filter(isPlainObject) } : {}),
    })),
    legendaryActionsPerRound: Math.max(0, asNumber(raw.legendaryActionsPerRound, 0)),
    legendaryActionsUsed: 0,
    resourcePools: normalizeIdArray(raw.resourcePools, (p) => {
      const max = Math.max(0, asNumber(p.max, 1));
      const validRechargeTypes = ['manual', 'round', 'shortRest', 'longRest', 'diceRoll'];
      let rechargeType = validRechargeTypes.includes(p.rechargeType) ? p.rechargeType : null;
      if (!rechargeType) {
        // Back-compat: older schema only had a boolean "resets each round" flag.
        rechargeType = asBool(p.resetsEachRound, false) ? 'round' : 'manual';
      }
      return {
        name: asString(p.name, 'Resource'),
        max,
        current: clamp(asNumber(p.current, max), 0, max),
        rechargeType,
        rechargeDie: Math.max(2, asNumber(p.rechargeDie, 6)),
        rechargeThreshold: Math.max(1, asNumber(p.rechargeThreshold, 5)),
      };
    }),
    items: normalizeIdArray(raw.items, (i) => ({
      name: asString(i.name, 'Item'),
      attunement: asBool(i.attunement, false),
      rarity: RARITIES.includes(i.rarity) ? i.rarity : 'Common',
      usage: asString(i.usage),
      description: asString(i.description),
      abilities: normalizeIdArray(i.abilities, (a) => ({
        name: asString(a.name, 'Ability'),
        usage: asString(a.usage),
        description: asString(a.description),
      })),
    })),
    homebrewPowers: normalizeIdArray(raw.homebrewPowers, (p) => ({
      name: asString(p.name, 'Power'),
      activationCost: asString(p.activationCost),
      range: asString(p.range),
      saveDC: asString(p.saveDC),
      formula: asString(p.formula),
      description: asString(p.description),
    })),
    customFields: normalizeIdArray(raw.customFields, (f) => ({ label: asString(f.label, 'Field'), value: asString(f.value, String(f.value ?? '')) })),
    customTabs: normalizeIdArray(raw.customTabs, (t) => {
      let entries = [];
      if (Array.isArray(t.entries)) {
        entries = t.entries
          .filter(isPlainObject)
          .map((e) => ({ id: uid(), title: asString(e.title, 'Entry'), content: asString(e.content) }));
      } else if (asString(t.content)) {
        // Accept the simpler single-content shape too (an AI is likely to
        // produce this) and fold it into one entry.
        entries = [{ id: uid(), title: asString(t.name, 'Notes'), content: asString(t.content) }];
      }
      return { name: asString(t.name, 'Tab'), content: '', entries };
    }),
  };
}

// ============================================================
// SUPABASE-BACKED PERSISTENCE
// ============================================================
// Characters live in the `characters` table as { id, owner_id, campaign_id,
// visibility, is_hidden_from_players, data }. `data` holds the same
// character shape this app always used (name, hp, abilities, ...) so the
// rest of the UI barely has to know the difference. rowToCharacter/
// characterToRow translate between the two.

function rowToCharacter(row) {
  const shares = Array.isArray(row.character_shares) ? row.character_shares : [];
  return {
    ...row.data,
    id: row.id,
    ownerId: row.owner_id,
    campaignId: row.campaign_id,
    visibility: row.visibility,
    isHiddenFromPlayers: row.is_hidden_from_players,
    canEditByShare: shares.some((s) => s.permission === 'edit'),
    lastEdited: row.updated_at ? new Date(row.updated_at).getTime() : row.data.lastEdited,
  };
}

function characterToDataPayload(character) {
  const { ownerId, campaignId, visibility, isHiddenFromPlayers, canEditByShare, ...data } = character;
  return data;
}

async function fetchCharacters() {
  // The embedded character_shares select rides along under RLS: for a
  // character you don't own, only your own share row (if any) is visible,
  // which is exactly what's needed to know whether you have edit access.
  const { data, error } = await supabase
    .from('characters')
    .select('*, character_shares(user_id, permission)')
    .order('updated_at', { ascending: false });
  if (error) throw error;
  return data.map(rowToCharacter);
}

// `preserveId` is only for undo-delete, where character.id is a real
// Supabase-assigned UUID from a row that just got deleted. Everywhere else
// (new characters, duplicates, imports) character.id is either absent or a
// client-side uid() string — not a valid uuid — so it must never be sent;
// letting Postgres assign a fresh id with its default is correct there.
async function insertCharacterRow(character, ownerId, { preserveId = false } = {}) {
  const payload = {
    owner_id: ownerId,
    data: characterToDataPayload(character),
    campaign_id: character.campaignId || null,
    visibility: character.visibility || 'private',
    is_hidden_from_players: !!character.isHiddenFromPlayers,
  };
  if (preserveId && character.id) payload.id = character.id;
  const { data, error } = await supabase.from('characters').insert(payload).select().single();
  if (error) throw error;
  return rowToCharacter(data);
}

async function updateCharacterRow(character) {
  const { error } = await supabase
    .from('characters')
    .update({
      data: characterToDataPayload(character),
      campaign_id: character.campaignId || null,
      visibility: character.visibility || 'private',
      is_hidden_from_players: !!character.isHiddenFromPlayers,
    })
    .eq('id', character.id);

const MAX_PORTRAIT_DIMENSION = 512; // px, keeps localStorage usage reasonable
const MAX_PORTRAIT_SOURCE_BYTES = 15 * 1024 * 1024; // 15MB guard before we even try to process a file

// Downscales an uploaded image client-side (canvas) and returns a JPEG data
// URL. Portraits are stored inline as base64 since there's no file storage
// available, so keeping them small matters for both load time and the
// localStorage quota.
function downscaleImageFile(file) {
  return new Promise((resolve, reject) => {
    if (file.size > MAX_PORTRAIT_SOURCE_BYTES) {
      reject(new Error('Image is too large (max 15MB).'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read the file.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode image.'));
      img.onload = () => {
        const scale = Math.min(1, MAX_PORTRAIT_DIMENSION / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function AvatarUpload({ character, onChange, editMode }) {
  const fileRef = useRef(null);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [showIconPicker, setShowIconPicker] = useState(false);

  const handleFile = async (file) => {
    if (!file.type.startsWith('image/')) {
      setError('Please choose an image file.');
      return;
    }
    setError('');
    setBusy(true);
    try {
      const dataUrl = await downscaleImageFile(file);
      onChange({ portraitUrl: dataUrl });
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  if (!editMode) {
    return <Avatar character={character} className="w-11 h-11 rounded-lg bg-gradient-to-br from-zinc-800 to-zinc-900 border border-zinc-700 shrink-0" />;
  }

  return (
    <div className="relative shrink-0 group">
      <button
        onClick={() => fileRef.current?.click()}
        title="Upload portrait"
        className="w-11 h-11 rounded-lg bg-gradient-to-br from-zinc-800 to-zinc-900 border border-zinc-700 flex items-center justify-center overflow-hidden relative"
      >
        <Avatar character={character} className="w-11 h-11 rounded-lg" />
        <div className="absolute inset-0 bg-black/0 group-hover:bg-black/50 flex items-center justify-center transition-colors">
          <ImagePlus className="w-4 h-4 text-white opacity-0 group-hover:opacity-100 transition-opacity" />
        </div>
      </button>
      {character.portraitUrl ? (
        <button
          onClick={() => onChange({ portraitUrl: '' })}
          title="Remove portrait"
          className="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center"
        >
          <X className="w-2.5 h-2.5 text-white" />
        </button>
      ) : (
        <button
          onClick={() => setShowIconPicker(!showIconPicker)}
          title="Choose fallback icon"
          className="absolute -bottom-1.5 -right-1.5 w-4 h-4 rounded-full bg-zinc-700 hover:bg-zinc-600 border border-zinc-600 flex items-center justify-center"
        >
          <ChevronDown className="w-2.5 h-2.5 text-zinc-300" />
        </button>
      )}
      <input
        ref={fileRef}
        type="file"
        accept="image/*"
        className="hidden"
        onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])}
      />
      {busy && <div className="absolute -bottom-5 left-0 text-[9px] text-zinc-500 whitespace-nowrap">Processing…</div>}
      {error && <div className="absolute -bottom-5 left-0 text-[9px] text-red-400 whitespace-nowrap">{error}</div>}
      {showIconPicker && (
        <div className="absolute top-full mt-2 left-0 z-40 bg-zinc-800 border border-zinc-700 rounded-lg p-2 grid grid-cols-5 gap-1 shadow-xl">
          {ICON_NAMES.map((name) => (
            <button
              key={name}
              onClick={() => { onChange({ icon: name }); setShowIconPicker(false); }}
              className={`w-7 h-7 rounded flex items-center justify-center hover:bg-zinc-700 ${character.icon === name ? 'bg-emerald-900 ring-1 ring-emerald-500' : ''}`}
            >
              <IconRenderer name={name} className="w-4 h-4 text-zinc-300" />
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

const TEXTAREA_SOFT_LIMIT = 20000; // characters — well beyond any reasonable description, just a sanity backstop

function TextArea({ value, onChange, editMode, placeholder = '', rows = 3 }) {
  const taRef = useRef(null);

  // Auto-grow the textarea to fit its content (up to a max height, after
  // which it scrolls internally) so pasting a long paragraph doesn't leave
  // the user stuck dragging a resize handle to see what they typed.
  useEffect(() => {
    if (taRef.current) {
      taRef.current.style.height = 'auto';
      taRef.current.style.height = `${Math.min(taRef.current.scrollHeight, 480)}px`;
    }
  }, [value, editMode]);

  if (editMode) {
    const len = (value || '').length;
    return (
      <div>
        <textarea
          ref={taRef}
          value={value || ''}
          placeholder={placeholder}
          rows={rows}
          onChange={(e) => onChange(e.target.value)}
          className="w-full bg-zinc-800 border border-zinc-700 rounded px-2 py-1.5 text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500 resize-y overflow-y-auto"
          style={{ minHeight: `${rows * 1.5}rem`, maxHeight: '480px' }}
        />
        {len > TEXTAREA_SOFT_LIMIT && (
          <div className="text-[10px] text-amber-500 mt-0.5">
            That's {len.toLocaleString()} characters — very long entries can slow saving and take up more storage.
          </div>
        )}
      </div>
    );
  }
  return (
    <div className="text-sm text-zinc-300 whitespace-pre-wrap leading-relaxed max-h-[480px] overflow-y-auto">
      {value || <span className="text-zinc-600 italic">No description.</span>}
    </div>
  );
}

  return (
    <div className="flex flex-wrap items-center gap-1.5">
      {tags.map((t) => (
        <Badge key={t} color={color} onRemove={() => onRemove(t)}>{t}</Badge>
      ))}
      <input
        value={val}
        onChange={(e) => setVal(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }}
        onBlur={submit}
        placeholder={placeholder}
        className="bg-transparent border-b border-dashed border-zinc-700 text-xs px-1 py-0.5 text-zinc-300 focus:outline-none focus:border-emerald-500 min-w-[100px]"

}

function CopyButton({ text, label, icon: Icon = ClipboardPaste }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    } catch (e) {
      // Clipboard API unavailable (e.g. insecure context) — fail quietly,
      // the schema is still visible to select and copy manually.
    }
  };
  return (
    <button
      onClick={handleCopy}
      className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition-colors"
    >

  );
}

function UndoToast({ message, onUndo, onDismiss, seconds = 8 }) {
  const [remaining, setRemaining] = useState(seconds);
  useEffect(() => {
    if (remaining <= 0) { onDismiss(); return; }
    const t = setTimeout(() => setRemaining((r) => r - 1), 1000);
    return () => clearTimeout(t);
  }, [remaining, onDismiss]);

  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] bg-zinc-800 border border-zinc-700 rounded-lg shadow-2xl px-4 py-3 flex items-center gap-4">
      <span className="text-sm text-zinc-200">{message}</span>
      <button onClick={onUndo} className="text-sm font-semibold text-emerald-400 hover:text-emerald-300">
        Undo ({remaining}s)
      </button>
      <button onClick={onDismiss} className="text-zinc-500 hover:text-zinc-300">
        <X className="w-4 h-4" />
      </button>
    </div>
  );
}

function TempHpBadge({ temp, onChange }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(String(temp));

  const commit = () => {
    onChange(Math.max(0, Number(draft) || 0));
    setEditing(false);
  };

  if (editing) {
    return (
      <input
        autoFocus
        type="number"
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') { setDraft(String(temp)); setEditing(false); } }}
        className="w-12 bg-zinc-800 border border-sky-600 rounded px-1 text-sm text-center text-sky-300 focus:outline-none"
      />
    );
  }

  return (
    <button
      onClick={() => { setDraft(String(temp)); setEditing(true); }}
      title="Click to set temp HP"
      className={`text-sm transition-colors ${temp > 0 ? 'text-sky-400 hover:text-sky-300' : 'text-zinc-700 hover:text-sky-500'}`}
    >
      {temp > 0 ? `+${temp}` : '+temp'}
    </button>
  );
}

function HPTracker({ hp, onChange, editMode, isConcentrating, onConcentrationCheck }) {
  const [delta, setDelta] = useState('');
  const [editingCurrent, setEditingCurrent] = useState(false);
  const [currentDraft, setCurrentDraft] = useState(String(hp.current));
  const [editingMax, setEditingMax] = useState(false);
  const [maxDraft, setMaxDraft] = useState(String(hp.max));
  const pct = hp.max > 0 ? clamp((hp.current / hp.max) * 100, 0, 100) : 0;
  const barColor = pct > 50 ? 'bg-emerald-500' : pct > 25 ? 'bg-amber-500' : 'bg-red-500';

  const applyDelta = (sign) => {
    const d = Number(delta);
    if (!d) return;
    onChange(applyHpDelta(hp, sign * d));
    if (sign < 0 && isConcentrating && onConcentrationCheck) {
      onConcentrationCheck(d);
    }
    setDelta('');
  };

  const commitCurrentEdit = () => {
    const v = clamp(Number(currentDraft) || 0, 0, hp.max);
    onChange({ ...hp, current: v });
    setEditingCurrent(false);
  };

  const commitMaxEdit = () => {
    const v = Math.max(1, Number(maxDraft) || 1);
    onChange({ ...hp, max: v, current: Math.min(hp.current, v) });
    setEditingMax(false);
  };

  return (
    <div className="flex items-center gap-3">
      <Heart className="w-5 h-5 text-red-400 shrink-0" />
      <div className="min-w-[140px]">
        <div className="flex items-baseline gap-1 font-mono">
          {editingCurrent ? (
            <input
              autoFocus
              type="number"
              value={currentDraft}
              onChange={(e) => setCurrentDraft(e.target.value)}
              onBlur={commitCurrentEdit}
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commitCurrentEdit(); } if (e.key === 'Escape') { setCurrentDraft(String(hp.current)); setEditingCurrent(false); } }}
              className="w-14 bg-zinc-800 border border-emerald-600 rounded px-1 text-xl font-bold text-zinc-100 text-center focus:outline-none"
            />
          ) : (
            <button
              onClick={() => { setCurrentDraft(String(hp.current)); setEditingCurrent(true); }}
              title="Click to set exact current HP"
              className="text-xl font-bold text-zinc-100 hover:text-emerald-400 transition-colors"
            >
              {hp.current}
            </button>
          )}
          <span className="text-zinc-500 text-sm">/</span>
          {editingMax ? (
            <input
              autoFocus
              type="number"
              value={maxDraft}
              onChange={(e) => setMaxDraft(e.target.value)}
              onBlur={commitMaxEdit}
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commitMaxEdit(); } if (e.key === 'Escape') { setMaxDraft(String(hp.max)); setEditingMax(false); } }}
              className="w-14 bg-zinc-800 border border-zinc-500 rounded px-1 text-sm text-zinc-100 text-center focus:outline-none"
            />
          ) : (
            <button
              onClick={() => { setMaxDraft(String(hp.max)); setEditingMax(true); }}
              title="Click to set max HP"
              className="text-zinc-500 text-sm hover:text-zinc-300 transition-colors"
            >
              {hp.max}
            </button>
          )}
          <TempHpBadge temp={hp.temp} onChange={(temp) => onChange({ ...hp, temp })} />
        </div>
        <div className="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden mt-1">
          <div className={`h-full ${barColor} transition-all duration-300`} style={{ width: `${pct}%` }} />
        </div>
      </div>
      <div className="flex items-center gap-1">
        <input
          type="number"
          value={delta}
          onChange={(e) => setDelta(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === 'Enter') { e.preventDefault(); applyDelta(e.shiftKey ? 1 : -1); }
          }}
          placeholder="0"
          title="Enter = damage · Shift+Enter = heal"
          className="w-14 bg-zinc-800 border border-zinc-700 rounded px-1.5 py-1 text-xs text-center font-mono text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500"
        />

function StatPill({ icon: Icon, label, value, onChange, editMode, color = 'zinc-400', suffix = '' }) {

function ConditionToggles({ conditions, onToggle, custom, onAddCustom, onRemoveCustom }) {
  const [showAll, setShowAll] = useState(false);
  const visible = showAll ? CONDITIONS : CONDITIONS.slice(0, 8);
  return (
    <div className="flex flex-wrap items-center gap-1.5">
      {visible.map((c) => (
        <Badge key={c} color={c === 'Concentrating' ? 'sky' : 'amber'} active={conditions.includes(c)} onClick={() => onToggle(c)} size="xs">
          {c}
        </Badge>
      ))}
      {!showAll && (
        <button onClick={() => setShowAll(true)} className="text-[10px] text-zinc-500 hover:text-zinc-300 underline">
          +{CONDITIONS.length - 8} more

        <Badge key={c} color="violet" active onRemove={() => onRemoveCustom(c)} size="xs">{c}</Badge>
      ))}
    </div>

}

function QuickCombatBar({ character, updateCharacter, editMode, setEditMode }) {
  const [customCondition, setCustomCondition] = useState('');
  const [concentrationPrompt, setConcentrationPrompt] = useState(null); // { dc } | null
  const abilities = character.abilities;
  const dexMod = abilityMod(abilities.dex);
  const conMod = abilityMod(abilities.con);
  const conSaveBonus = conMod + (character.saveProficiencies.includes('con') ? character.proficiencyBonus : 0);

  const toggleCondition = (c) => {
    const has = character.conditions.includes(c);
    updateCharacter({ conditions: has ? character.conditions.filter((x) => x !== c) : [...character.conditions, c] });
  };

  const addCustomCondition = () => {
    const v = customCondition.trim();
    if (v && !character.conditions.includes(v)) {
      updateCharacter({ conditions: [...character.conditions, v] });
    }
    setCustomCondition('');
  };

  const KNOWN = new Set(CONDITIONS);
  const customActiveConditions = character.conditions.filter((c) => !KNOWN.has(c));
  const knownActiveOnly = character.conditions.filter((c) => KNOWN.has(c));
  const isConcentrating = character.conditions.includes('Concentrating');

  const handleConcentrationCheck = (damageTaken) => {
    const dc = Math.max(10, Math.floor(damageTaken / 2));
    setConcentrationPrompt({ dc });
  };

  return (
    <div className="sticky top-0 z-30 bg-zinc-950/95 backdrop-blur border-b border-zinc-800 shadow-lg">
      <div className="px-4 py-3">
        <div className="flex items-start justify-between gap-4 flex-wrap">
          {/* Identity */}
          <div className="flex items-center gap-3 min-w-[200px]">
            <AvatarUpload character={character} onChange={updateCharacter} editMode={editMode} />
            <div className="min-w-0">
              {editMode ? (
                <input
                  value={character.name}
                  onChange={(e) => updateCharacter({ name: e.target.value })}
                  className="bg-zinc-800 border border-zinc-700 rounded px-2 py-0.5 text-base font-bold text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500 w-full"
                />
              ) : (
                <div className="text-base font-bold text-zinc-100 truncate">{character.name}</div>
              )}
              {editMode ? (
                <input
                  value={character.subtitle}
                  onChange={(e) => updateCharacter({ subtitle: e.target.value })}
                  placeholder="Subtitle / title"
                  className="bg-zinc-800 border border-zinc-700 rounded px-2 py-0.5 text-xs text-zinc-400 focus:outline-none focus:ring-1 focus:ring-emerald-500 w-full mt-0.5"
                />
              ) : (
                <div className="text-xs text-zinc-500 truncate">{character.subtitle || character.role}</div>
              )}
            </div>
          </div>

          {/* HP */}
          <HPTracker
            hp={character.hp}
            onChange={(hp) => updateCharacter({ hp })}
            editMode={editMode}
            isConcentrating={isConcentrating}
            onConcentrationCheck={handleConcentrationCheck}
          />

          {/* Stat pills */}
          <div className="flex items-center gap-2">
            <StatPill icon={Shield} label="AC" value={character.ac} color="sky-400" onChange={(v) => updateCharacter({ ac: v })} editMode={editMode} />
            <StatPill icon={Footprints} label="Speed" value={character.speed} color="zinc-400" onChange={(v) => updateCharacter({ speed: v })} editMode={editMode} />
            <StatPill icon={Zap} label="Init" value={character.initiativeMod ?? dexMod} suffix="" color="amber-400" onChange={(v) => updateCharacter({ initiativeMod: v })} editMode={editMode} />
            <StatPill icon={Target} label="Prof" value={character.proficiencyBonus} color="violet-400" onChange={(v) => updateCharacter({ proficiencyBonus: v })} editMode={editMode} />
          </div>

          {/* Mode toggle: label shows current state, button shows the action */}
          <div className="flex items-center gap-2">
            <span className={`text-[10px] font-semibold uppercase tracking-wider px-2 py-1 rounded ${editMode ? 'bg-amber-950 text-amber-400' : 'bg-emerald-950 text-emerald-400'}`}>
              {editMode ? 'Editing' : 'Playing'}
            </span>
            <button
              onClick={() => setEditMode(!editMode)}
              title={editMode ? 'Finish editing and return to play mode' : 'Switch to edit mode to change stats and content'}
              className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${
                editMode ? 'bg-emerald-600 text-white hover:bg-emerald-500' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'
              }`}
            >
              {editMode ? <PlayCircle className="w-3.5 h-3.5" /> : <PenSquare className="w-3.5 h-3.5" />}
              {editMode ? 'Done Editing' : 'Edit'}
            </button>
          </div>
        </div>

        {/* Conditions row */}
        <div className="mt-2.5 pt-2.5 border-t border-zinc-800/70 flex items-center gap-2 flex-wrap">
          <span className="text-[10px] uppercase tracking-wider text-zinc-600 shrink-0">Conditions</span>
          <ConditionToggles
            conditions={knownActiveOnly}
            onToggle={toggleCondition}
            custom={customActiveConditions}
            onRemoveCustom={(c) => updateCharacter({ conditions: character.conditions.filter((x) => x !== c) })}
          />
          {editMode && (
            <input
              value={customCondition}
              onChange={(e) => setCustomCondition(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addCustomCondition(); } }}
              onBlur={addCustomCondition}
              placeholder="+ custom"
              className="bg-transparent border-b border-dashed border-zinc-700 text-[10px] px-1 text-zinc-400 focus:outline-none focus:border-emerald-500 w-16"
            />
          )}
        </div>

        {concentrationPrompt && (
          <div className="mt-2.5 flex items-center justify-between gap-2 bg-sky-950 border border-sky-800 rounded-lg px-3 py-2">
            <span className="text-xs text-sky-300">
              <strong>Concentration check:</strong> DC {concentrationPrompt.dc} CON save (yours: {fmtMod(conSaveBonus)})
            </span>
            <button onClick={() => setConcentrationPrompt(null)} className="text-sky-500 hover:text-sky-300">
              <X className="w-3.5 h-3.5" />
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function SkillsBlock({ character, updateCharacter, editMode }) {
  const skillExpertise = character.skillExpertise || [];
  const skillOverrides = character.skillOverrides || {};

  // Cycles a skill through None -> Proficient -> Expertise -> None.
  const cycleSkill = (key) => {
    const isProf = character.skillProficiencies.includes(key);
    const isExpert = skillExpertise.includes(key);
    if (!isProf) {
      updateCharacter({ skillProficiencies: [...character.skillProficiencies, key] });
    } else if (isProf && !isExpert) {
      updateCharacter({ skillExpertise: [...skillExpertise, key] });
    } else {
      updateCharacter({
        skillProficiencies: character.skillProficiencies.filter((x) => x !== key),
        skillExpertise: skillExpertise.filter((x) => x !== key),
      });
    }
  };

  const setOverride = (key, value) => {
    const next = { ...skillOverrides };
    if (value === '' || value === null) {
      delete next[key];
    } else {
      next[key] = Number(value);
    }
    updateCharacter({ skillOverrides: next });
  };

  return (
    <Collapsible title="Skills" defaultOpen={false}>
      <p className="text-[10px] text-zinc-600 mb-2">Click the circle to cycle proficiency: none → proficient → expertise (double bonus).</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-1">
        {SKILLS.map((sk) => {
          const mod = abilityMod(character.abilities[sk.ability]);
          const isProf = character.skillProficiencies.includes(sk.key);
          const isExpert = skillExpertise.includes(sk.key);
          const profMultiplier = isExpert ? 2 : isProf ? 1 : 0;
          const computedTotal = mod + profMultiplier * character.proficiencyBonus;
          const hasOverride = Object.prototype.hasOwnProperty.call(skillOverrides, sk.key);
          const total = hasOverride ? skillOverrides[sk.key] : computedTotal;
          return (
            <div key={sk.key} className="flex items-center justify-between px-2 py-1 rounded hover:bg-zinc-800/50">
              <button onClick={() => cycleSkill(sk.key)} className="flex items-center gap-1.5 text-sm text-zinc-300 text-left flex-1 min-w-0">
                {isExpert ? (
                  <Star className="w-3.5 h-3.5 text-amber-400 shrink-0" />
                ) : isProf ? (
                  <CheckCircle2 className="w-3.5 h-3.5 text-violet-400 shrink-0" />
                ) : (
                  <Circle className="w-3.5 h-3.5 text-zinc-700 shrink-0" />
                )}
                <span className="truncate">{sk.label}</span>
                <span className="text-[10px] text-zinc-600 uppercase shrink-0">{sk.ability}</span>
                {isExpert && <span className="text-[9px] text-amber-500 shrink-0">(Expertise)</span>}
              </button>
              {editMode ? (
                <input
                  type="number"
                  value={hasOverride ? skillOverrides[sk.key] : ''}
                  placeholder={fmtMod(computedTotal)}
                  onChange={(e) => setOverride(sk.key, e.target.value)}
                  title="Override this skill's bonus manually — leave blank to use the computed value"
                  className="w-14 bg-zinc-800 border border-zinc-700 rounded px-1 py-0.5 text-xs text-center font-mono text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500"
                />
              ) : (
                <span className={`font-mono text-sm ${hasOverride ? 'text-amber-300' : 'text-zinc-200'}`}>{fmtMod(total)}</span>
              )}
            </div>
          );
        })}
      </div>
    </Collapsible>
  );
}

function LegendaryCounter({ character, updateCharacter, editMode }) {
  const max = character.legendaryActionsPerRound || 0;
  const used = character.legendaryActionsUsed || 0;
  const remaining = max - used;
  const [editingRemaining, setEditingRemaining] = useState(false);
  const [remainingDraft, setRemainingDraft] = useState(String(remaining));
  const [editingMax, setEditingMax] = useState(false);
  const [maxDraft, setMaxDraft] = useState(String(max));

  const commitRemaining = () => {
    const r = clamp(Number(remainingDraft) || 0, 0, max);
    updateCharacter({ legendaryActionsUsed: max - r });
    setEditingRemaining(false);
  };

  const commitMax = () => {
    const m = Math.max(0, Number(maxDraft) || 0);
    updateCharacter({ legendaryActionsPerRound: m, legendaryActionsUsed: Math.min(used, m) });
    setEditingMax(false);
  };

  return (
    <Card className="p-3 flex items-center justify-between flex-wrap gap-2">
      <div className="flex items-center gap-2">
        <Crown className="w-4 h-4 text-amber-400" />
        <span className="text-sm font-medium text-zinc-300">Legendary Actions per Round</span>
        {editingMax ? (
          <input
            autoFocus
            type="number"
            value={maxDraft}
            onChange={(e) => setMaxDraft(e.target.value)}
            onBlur={commitMax}
            onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commitMax(); } if (e.key === 'Escape') setEditingMax(false); }}
            className="w-12 bg-zinc-800 border border-amber-600 rounded px-1 text-sm text-center font-mono text-zinc-100 focus:outline-none"
          />
        ) : (
          <button
            onClick={() => { setMaxDraft(String(max)); setEditingMax(true); }}
            title="Click to set max legendary actions per round"
            className="font-mono text-sm font-bold text-amber-400 hover:text-amber-300 bg-amber-950 border border-amber-800 rounded px-2 py-0.5"
          >
            {max}
          </button>
        )}
      </div>
      {max > 0 && (
        <div className="flex items-center gap-2">
          <div className="flex items-center gap-1">
            {Array.from({ length: max }).map((_, i) => (
              <button
                key={i}
                onClick={() => updateCharacter({ legendaryActionsUsed: i < used ? i : i + 1 })}
                className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${
                  i < used ? 'bg-zinc-800 border-zinc-700' : 'bg-amber-500 border-amber-300'
                }`}
              />
            ))}
          </div>
          {editingRemaining ? (
            <input
              autoFocus
              type="number"
              value={remainingDraft}
              onChange={(e) => setRemainingDraft(e.target.value)}
              onBlur={commitRemaining}
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commitRemaining(); } if (e.key === 'Escape') setEditingRemaining(false); }}
              className="w-10 bg-zinc-800 border border-amber-600 rounded px-1 text-sm text-center font-mono text-zinc-100 focus:outline-none"
            />
          ) : (
            <button
              onClick={() => { setRemainingDraft(String(remaining)); setEditingRemaining(true); }}
              title="Click to set exact remaining legendary actions"
              className="font-mono text-sm text-zinc-400 hover:text-amber-300"
            >
              {remaining}
            </button>
          )}
          <span className="font-mono text-sm text-zinc-600">/{max}</span>
          <button onClick={() => updateCharacter({ legendaryActionsUsed: 0 })} className="text-[10px] text-zinc-500 hover:text-emerald-400 underline">Reset</button>
        </div>
      )}
    </Card>
  );
}

function PoolCurrentEditor({ pool, onChange }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(String(pool.current));

  const commit = () => {
    onChange(clamp(Number(draft) || 0, 0, pool.max));
    setEditing(false);
  };

  if (editing) {
    return (
      <input
        autoFocus
        type="number"
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') setEditing(false); }}
        className="w-12 bg-zinc-800 border border-violet-600 rounded px-1 text-xs text-center font-mono text-zinc-100 focus:outline-none"
      />
    );
  }

  return (
    <button onClick={() => { setDraft(String(pool.current)); setEditing(true); }} title="Click to set exact value" className="font-mono text-xs text-zinc-500 hover:text-violet-300">
      {pool.current}/{pool.max}
    </button>
  );
}

const RECHARGE_TYPES = [
  { key: 'manual', label: 'Manual only' },
  { key: 'round', label: 'Refills each round' },
  { key: 'shortRest', label: 'Refills on short rest' },
  { key: 'longRest', label: 'Refills on long rest' },
  { key: 'diceRoll', label: 'Recharges on a dice roll' },
];

// Reads a pool's recharge type, migrating the older boolean
// resetsEachRound flag (from before this feature existed) to 'round'.
function getRechargeType(pool) {
  if (pool.rechargeType) return pool.rechargeType;
  if (pool.resetsEachRound) return 'round';
  return 'manual';
}

function InlineNumberEditor({ value, onChange, min = 1, className = '' }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(String(value));

  const commit = () => {
    onChange(Math.max(min, Number(draft) || min));
    setEditing(false);
  };

  if (editing) {
    return (
      <input
        autoFocus
        type="number"
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') setEditing(false); }}
        className={`w-8 bg-zinc-800 border border-violet-600 rounded text-center font-mono text-[10px] focus:outline-none ${className}`}
      />
    );
  }

  return (
    <button onClick={() => { setDraft(String(value)); setEditing(true); }} title="Click to edit" className={`hover:text-violet-300 underline decoration-dotted underline-offset-2 ${className}`}>
      {value}
    </button>
  );
}

function RechargeRoller({ pool, onUpdate }) {
  const [lastRoll, setLastRoll] = useState(null);
  const die = pool.rechargeDie || 6;
  const threshold = pool.rechargeThreshold || 5;

  const roll = () => {
    const result = 1 + Math.floor(Math.random() * die);
    setLastRoll(result);
    if (result >= threshold) onUpdate({ current: pool.max });
  };

  return (
    <div className="flex items-center gap-2 flex-wrap text-[10px]">
      <button onClick={roll} className="flex items-center gap-1 px-2 py-1 rounded bg-violet-950 border border-violet-800 text-violet-300 hover:bg-violet-900">
        <Zap className="w-3 h-3" /> Roll d<InlineNumberEditor value={die} min={2} onChange={(v) => onUpdate({ rechargeDie: v })} />
      </button>
      <span className="text-zinc-500">
        recharges on <InlineNumberEditor value={threshold} min={1} onChange={(v) => onUpdate({ rechargeThreshold: v })} />–{die}
      </span>
      {lastRoll !== null && (
        <span className={`font-mono ${lastRoll >= threshold ? 'text-emerald-400' : 'text-zinc-500'}`}>
          Rolled {lastRoll}{lastRoll >= threshold ? ' — recharged!' : ''}
        </span>
      )}
    </div>
  );
}

function PoolMaxEditor({ pool, onChange }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(String(pool.max));

  const commit = () => {
    const m = Math.max(0, Number(draft) || 0);
    onChange(m);
    setEditing(false);
  };

  if (editing) {
    return (
      <input
        autoFocus
        type="number"
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') setEditing(false); }}
        className="w-14 bg-zinc-800 border border-violet-600 rounded px-1 py-0.5 text-xs text-center font-mono text-zinc-100 focus:outline-none"
      />
    );
  }

  return (
    <button
      onClick={() => { setDraft(String(pool.max)); setEditing(true); }}
      title="Click to set total uses"
      className="flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded border border-zinc-700 text-zinc-500 hover:text-violet-300 hover:border-violet-700"
    >
      Total: <span className="font-mono text-zinc-300">{pool.max}</span>
    </button>
  );
}

function ResourcePoolCard({ pool, onUpdate, onRemove, editMode }) {
  const rechargeType = getRechargeType(pool);
  return (
    <div className="bg-zinc-950 border border-zinc-800 rounded-lg p-2.5">
      <div className="flex items-center justify-between mb-1.5 gap-2">
        {editMode ? (
          <input
            value={pool.name}
            onChange={(e) => onUpdate({ name: e.target.value })}
            className="bg-transparent text-xs font-medium text-zinc-300 focus:outline-none flex-1 min-w-0"
          />
        ) : (
          <span className="text-xs font-medium text-zinc-300 truncate">{pool.name}</span>
        )}
        <div className="flex items-center gap-1.5 shrink-0">
          <PoolMaxEditor pool={pool} onChange={(max) => onUpdate({ max, current: Math.min(pool.current, max) })} />
          {editMode && (
            <button onClick={onRemove} className="text-zinc-600 hover:text-red-400">
              <X className="w-3.5 h-3.5" />
            </button>
          )}
        </div>
      </div>

      <div className="flex items-center gap-2">
        <div className="flex gap-1 flex-wrap flex-1">
          {Array.from({ length: pool.max }).map((_, i) => (
            <button
              key={i}
              onClick={() => onUpdate({ current: i < pool.current ? i : i + 1 })}
              title={i < pool.current ? 'Click to mark as used' : 'Click to mark as available'}
              className={`w-5 h-5 rounded border-2 transition-colors ${i < pool.current ? 'bg-violet-500 border-violet-300' : 'bg-zinc-800 border-zinc-700'}`}
            />
          ))}
        </div>
        <PoolCurrentEditor pool={pool} onChange={(current) => onUpdate({ current })} />
      </div>

      {editMode ? (
        <div className="mt-2 pt-2 border-t border-zinc-900 space-y-1.5">
          <div className="text-[10px] uppercase tracking-wider text-zinc-500">Recharges</div>
          <select
            value={rechargeType}
            onChange={(e) => onUpdate({ rechargeType: e.target.value })}
            className="w-full bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-xs text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          >
            {RECHARGE_TYPES.map((rt) => <option key={rt.key} value={rt.key}>{rt.label}</option>)}
          </select>
          {rechargeType === 'diceRoll' && (
            <div className="flex items-center gap-2 text-xs text-zinc-400">
              <span>Recharges on</span>
              <NumberField value={pool.rechargeThreshold || 5} min={1} onChange={(v) => onUpdate({ rechargeThreshold: v })} className="w-12" />
              <span>–</span>
              <NumberField value={pool.rechargeDie || 6} min={1} onChange={(v) => onUpdate({ rechargeDie: v })} className="w-12" />
              <span>(d{pool.rechargeDie || 6})</span>
            </div>
          )}
        </div>
      ) : (
        rechargeType === 'diceRoll' && (
          <div className="mt-1.5">
            {pool.current < pool.max ? (
              <RechargeRoller pool={pool} onUpdate={onUpdate} />
            ) : (
              <div className="flex items-center gap-2 flex-wrap text-[10px] text-zinc-600">
                <span>Full — recharges on <InlineNumberEditor value={pool.rechargeThreshold || 5} min={1} onChange={(v) => onUpdate({ rechargeThreshold: v })} />–<InlineNumberEditor value={pool.rechargeDie || 6} min={2} onChange={(v) => onUpdate({ rechargeDie: v })} /></span>
              </div>
            )}
          </div>
        )
      )}
    </div>
  );
}

const RECHARGE_GROUPS = [
  { key: 'shortRest', label: 'Short Rest', accent: 'sky' },
  { key: 'longRest', label: 'Long Rest', accent: 'violet' },
  { key: 'round', label: 'Per Round', accent: 'amber' },
  { key: 'diceRoll', label: 'Recharge Roll', accent: 'emerald' },
  { key: 'manual', label: 'Manual / Other', accent: 'zinc' },
];

function ResourcesSection({ character, updateCharacter, editMode }) {
  const pools = character.resourcePools;
  const addPool = () => updateCharacter({ resourcePools: [...pools, { id: uid(), name: 'New Resource', current: 1, max: 1, rechargeType: 'manual', rechargeDie: 6, rechargeThreshold: 5 }] });
  const updatePool = (id, patch) => updateCharacter({ resourcePools: pools.map((p) => (p.id === id ? { ...p, ...patch } : p)) });
  const removePool = (id) => updateCharacter({ resourcePools: pools.filter((p) => p.id !== id) });

  const takeRest = (type) => {
    updateCharacter({
      resourcePools: pools.map((p) => {
        const rt = getRechargeType(p);
        // A long rest also restores everything a short rest would.
        const shouldRefill = type === 'longRest' ? (rt === 'shortRest' || rt === 'longRest') : rt === 'shortRest';
        return shouldRefill ? { ...p, current: p.max } : p;
      }),
    });
  };

  const shortRestCount = pools.filter((p) => getRechargeType(p) === 'shortRest').length;
  const longRestCount = pools.filter((p) => ['shortRest', 'longRest'].includes(getRechargeType(p))).length;

  return (
    <div className="space-y-3">
      <Card className="p-3 flex items-center justify-between flex-wrap gap-2">
        <div className="flex items-center gap-2 text-sm font-medium text-zinc-300">
          <Zap className="w-4 h-4 text-violet-400" /> Rest
        </div>
        <div className="flex items-center gap-2">
          <button
            onClick={() => takeRest('shortRest')}
            disabled={shortRestCount === 0}
            className="flex items-center gap-1.5 bg-sky-900 hover:bg-sky-800 disabled:opacity-40 disabled:cursor-not-allowed text-sky-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors"
          >
            Take a Short Rest {shortRestCount > 0 && `(${shortRestCount})`}
          </button>
          <button
            onClick={() => takeRest('longRest')}
            disabled={longRestCount === 0}
            className="flex items-center gap-1.5 bg-violet-800 hover:bg-violet-700 disabled:opacity-40 disabled:cursor-not-allowed text-violet-100 text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors"
          >
            Take a Long Rest {longRestCount > 0 && `(${longRestCount})`}
          </button>
        </div>
      </Card>

      {pools.length === 0 ? (
        <Card className="p-4 text-center">
          <div className="text-xs text-zinc-600 italic">No resource pools yet. Add one for anything with limited uses — spell slots, ki points, breath weapons, homebrew power points.</div>
          {editMode && (
            <button onClick={addPool} className="mt-3 flex items-center gap-1.5 mx-auto bg-violet-700 hover:bg-violet-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">
              <Plus className="w-3.5 h-3.5" /> Add Resource
            </button>
          )}
        </Card>
      ) : (
        RECHARGE_GROUPS.map((group) => {
          const groupPools = pools.filter((p) => getRechargeType(p) === group.key);
          if (groupPools.length === 0) return null;
          return (
            <Collapsible key={group.key} title={group.label} defaultOpen badge={<span className="text-[10px] text-zinc-600 font-mono">({groupPools.length})</span>}>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {groupPools.map((p) => (
                  <ResourcePoolCard key={p.id} pool={p} onUpdate={(patch) => updatePool(p.id, patch)} onRemove={() => removePool(p.id)} editMode={editMode} />
                ))}
              </div>
            </Collapsible>
          );
        })
      )}

      {editMode && pools.length > 0 && (
        <button onClick={addPool} className="w-full flex items-center justify-center gap-1.5 bg-zinc-900 border border-dashed border-zinc-700 hover:border-violet-700 text-zinc-500 hover:text-violet-300 text-xs font-semibold px-3 py-2 rounded-lg transition-colors">
          <Plus className="w-3.5 h-3.5" /> Add Resource
        </button>
      )}
    </div>
  );
}

function NextRoundButton({ character, updateCharacter }) {
  const hasLegendary = (character.legendaryActionsPerRound || 0) > 0;
  const perRoundPools = (character.resourcePools || []).filter((p) => getRechargeType(p) === 'round');
  if (!hasLegendary && perRoundPools.length === 0) return null;

  const advance = () => {
    const patch = {};
    if (hasLegendary) patch.legendaryActionsUsed = 0;
    if (perRoundPools.length > 0) {
      patch.resourcePools = character.resourcePools.map((p) => (getRechargeType(p) === 'round' ? { ...p, current: p.max } : p));
    }
    updateCharacter(patch);
  };

  return (
    <button
      onClick={advance}
      className="w-full flex items-center justify-center gap-2 bg-violet-700 hover:bg-violet-600 text-white text-sm font-semibold px-3 py-2.5 rounded-lg transition-colors"
    >
      <Zap className="w-4 h-4" /> Next Round
      <span className="text-[10px] font-normal text-violet-200">
        (resets{hasLegendary ? ' legendary actions' : ''}{hasLegendary && perRoundPools.length > 0 ? ' +' : ''}{perRoundPools.length > 0 ? ` ${perRoundPools.length} resource${perRoundPools.length > 1 ? 's' : ''}` : ''})
      </span>
    </button>
  );
}

function ActionsTab({ character, updateCharacter, editMode }) {
  const addAction = (category) => updateCharacter({
    actions: [...character.actions, { id: uid(), category, name: category === 'legendary' ? 'New Legendary Action' : 'New Action', cost: '', description: '' }],
  });
  const updateAction = (id, patch) => updateCharacter({ actions: character.actions.map((a) => (a.id === id ? { ...a, ...patch } : a)) });
  const removeAction = (id) => updateCharacter({ actions: character.actions.filter((a) => a.id !== id) });

  const categories = ['action', 'bonus', 'reaction', 'lair'];
  const legendaryItems = character.actions.filter((a) => a.category === 'legendary');
  const hasLegendary = (character.legendaryActionsPerRound || 0) > 0;

  return (
    <div className="space-y-3">
      <NextRoundButton character={character} updateCharacter={updateCharacter} />

      {/* Legendary Actions — shown whenever the creature has any set up, or
          always in Edit Mode so a player building a new boss can find it. */}
      {(hasLegendary || legendaryItems.length > 0 || editMode) && (
        <>
          <LegendaryCounter character={character} updateCharacter={updateCharacter} editMode={editMode} />
          <Collapsible
            title="Legendary Action Abilities"
            defaultOpen
            badge={legendaryItems.length > 0 && <span className="text-[10px] text-zinc-600 font-mono">({legendaryItems.length})</span>}
            right={editMode && <IconButton icon={Plus} label="Add" onClick={(e) => { e.stopPropagation(); addAction('legendary'); }} variant="primary" />}
          >
            {legendaryItems.length === 0 ? (
              <div className="text-xs text-zinc-600 italic">No legendary actions yet. Add one for each option the creature can take, e.g. "Detect" (1 action) or "Attack" (2 actions).</div>
            ) : (
              <div className="space-y-2">
                {legendaryItems.map((a) => (
                  <ActionCard key={a.id} action={a} onUpdate={(patch) => updateAction(a.id, patch)} onRemove={() => removeAction(a.id)} editMode={editMode} />
                ))}
              </div>
            )}
          </Collapsible>
        </>
      )}

      {/* Resources — spell slots, ki, breath weapons, homebrew power points,
          grouped by how they recharge, with rest buttons to bulk-refill. */}
      <ResourcesSection character={character} updateCharacter={updateCharacter} editMode={editMode} />

      {categories.map((cat) => {
        const items = character.actions.filter((a) => a.category === cat);
        if (items.length === 0 && !editMode) return null;
        if (cat === 'lair' && items.length === 0 && !editMode) return null;
        return (
          <Collapsible
            key={cat}
            title={ACTION_CATEGORY_LABELS[cat]}
            defaultOpen={cat === 'action'}
            badge={items.length > 0 && <span className="text-[10px] text-zinc-600 font-mono">({items.length})</span>}
            right={editMode && <IconButton icon={Plus} label="Add" onClick={(e) => { e.stopPropagation(); addAction(cat); }} variant="primary" />}
          >
            {items.length === 0 ? (
              <div className="text-xs text-zinc-600 italic">None yet.</div>
            ) : (
              <div className="space-y-2">
                {items.map((a) => (
                  <ActionCard key={a.id} action={a} onUpdate={(patch) => updateAction(a.id, patch)} onRemove={() => removeAction(a.id)} editMode={editMode} />
                ))}
              </div>
            )}
          </Collapsible>
        );
      })}
    </div>
  );
}

// ============================================================
// TAB: HOMEBREW POWERS & ITEMS
// ============================================================

const RARITY_COLORS = {
  Common: 'zinc', Uncommon: 'emerald', Rare: 'sky', 'Very Rare': 'violet', Legendary: 'amber', Artifact: 'red',
};

function ItemAbilityRow({ ability, onUpdate, onRemove, editMode }) {
  return (
    <div className="bg-zinc-900 border border-zinc-800 rounded-md p-2">
      <div className="flex items-center justify-between gap-2 mb-1">
        {editMode ? (
          <input
            value={ability.name}
            onChange={(e) => onUpdate({ name: e.target.value })}
            placeholder="Ability name"
            className="bg-zinc-800 border border-zinc-700 rounded px-1.5 py-0.5 text-xs font-semibold text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500 flex-1 min-w-0"
          />
        ) : (
          <span className="text-xs font-semibold text-zinc-200 truncate">{ability.name || 'Unnamed Ability'}</span>
        )}
        <div className="flex items-center gap-1.5 shrink-0">
          {editMode ? (
            <input
              value={ability.usage}
              onChange={(e) => onUpdate({ usage: e.target.value })}
              placeholder="1/Day"
              className="w-20 bg-zinc-800 border border-zinc-700 rounded px-1.5 py-0.5 text-[10px] text-amber-300 focus:outline-none focus:ring-1 focus:ring-emerald-500"
            />
          ) : (
            ability.usage && <Badge color="amber" size="xs">{ability.usage}</Badge>
          )}
          {editMode && (
            <button onClick={onRemove} className="text-zinc-600 hover:text-red-400">
              <X className="w-3 h-3" />
            </button>
          )}
        </div>
      </div>
      <TextArea value={ability.description} onChange={(v) => onUpdate({ description: v })} editMode={editMode} placeholder="What this ability does…" rows={2} />
    </div>
  );
}

function ItemCard({ item, onUpdate, onRemove, editMode }) {
  const [open, setOpen] = useState(false);
  const rarityColor = RARITY_COLORS[item.rarity] || 'zinc';
  const abilities = item.abilities || [];

  const addAbility = () => onUpdate({ abilities: [...abilities, { id: uid(), name: 'New Ability', usage: '', description: '' }] });
  const updateAbility = (id, patch) => onUpdate({ abilities: abilities.map((a) => (a.id === id ? { ...a, ...patch } : a)) });
  const removeAbility = (id) => onUpdate({ abilities: abilities.filter((a) => a.id !== id) });

  return (
    <Card className="p-3">
      <div className="flex items-start justify-between gap-2">
        <button onClick={() => setOpen(!open)} className="flex items-start gap-2 flex-1 min-w-0 text-left">
          {open ? <ChevronDown className="w-3.5 h-3.5 text-zinc-500 shrink-0 mt-1" /> : <ChevronRight className="w-3.5 h-3.5 text-zinc-500 shrink-0 mt-1" />}
          <div className="min-w-0 flex-1">
            {editMode ? (
              <input
                value={item.name}
                onChange={(e) => onUpdate({ name: e.target.value })}
                onClick={(e) => e.stopPropagation()}
                className="bg-zinc-800 border border-zinc-700 rounded px-2 py-0.5 text-sm font-semibold text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500 w-full"
              />
            ) : (
              <div className="text-sm font-semibold text-zinc-100">{item.name}</div>
            )}
            <div className="flex flex-wrap gap-1.5 mt-1">
              <Badge color={rarityColor} size="xs">{item.rarity}</Badge>
              {item.attunement && <Badge color="violet" size="xs">Attunement</Badge>}
              {item.usage && <Badge color="amber" size="xs">{item.usage}</Badge>}
              {abilities.length > 0 && <Badge color="sky" size="xs">{abilities.length} {abilities.length === 1 ? 'ability' : 'abilities'}</Badge>}
            </div>
          </div>

// A user-created category can hold as many separate entries as the player
// wants — each its own title and freeform text — instead of one shared box,
// so adding a new piece of lore never requires creating a whole new tab.
function CustomCategoryTab({ tab, onUpdate, editMode }) {
  const entries = tab.entries || [];

  // One-time migration: older tabs only had a single "content" string.
  // Fold it into the new entries list the first time this renders so
  // nothing written before this feature existed gets lost.
  useEffect(() => {
    if (tab.content && entries.length === 0) {
      onUpdate({ content: '', entries: [{ id: uid(), title: tab.name || 'Notes', content: tab.content }] });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tab.id]);

  const addEntry = () => onUpdate({ entries: [...entries, { id: uid(), title: 'New Entry', content: '' }] });
  const updateEntry = (id, patch) => onUpdate({ entries: entries.map((e) => (e.id === id ? { ...e, ...patch } : e)) });
  const removeEntry = (id) => onUpdate({ entries: entries.filter((e) => e.id !== id) });

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <p className="text-xs text-zinc-600">Add as many entries as you want in this category — lore, bonds, notes, whatever fits.</p>
        {editMode && (
          <button onClick={addEntry} className="flex items-center gap-1.5 bg-violet-700 hover:bg-violet-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shrink-0">
            <Plus className="w-3.5 h-3.5" /> Add Entry
          </button>
        )}
      </div>
      {entries.length === 0 ? (
        <Card className="p-4 text-center">
          <div className="text-xs text-zinc-600 italic">No entries yet in this category.</div>
          {editMode && (
            <button onClick={addEntry} className="mt-3 flex items-center gap-1.5 mx-auto bg-violet-700 hover:bg-violet-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">
              <Plus className="w-3.5 h-3.5" /> Add Entry
            </button>
          )}
        </Card>
      ) : (
        <div className="space-y-2">
          {entries.map((e) => (
            <CustomEntryCard key={e.id} entry={e} onUpdate={(patch) => updateEntry(e.id, patch)} onRemove={() => removeEntry(e.id)} editMode={editMode} />
          ))}
        </div>
      )}
    </div>
  );
}

// Share & Visibility: attach a character to a campaign (visible to every
// member of that campaign), grant specific people view/edit access, and —
// if the current user is the DM of the attached campaign — hide it from
// players entirely (for NPCs/secrets) while the DM still sees it.
function ShareModal({ character, campaigns, currentUserId, onUpdateCharacter, onClose }) {
  const [shares, setShares] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [addEmail, setAddEmail] = useState('');
  const [addPermission, setAddPermission] = useState('view');
  const [busy, setBusy] = useState(false);

  const loadShares = () => {
    setLoading(true);
    fetchShares(character.id)
      .then((rows) => setShares(rows))
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  };

  useEffect(loadShares, [character.id]);

  const attachedCampaign = campaigns.find((c) => c.id === character.campaignId);
  const isDmOfAttached = attachedCampaign && attachedCampaign.dm_id === currentUserId;

  const handleCampaignChange = (campaignId) => {
    onUpdateCharacter({
      campaignId: campaignId || null,
      visibility: campaignId ? 'campaign' : 'private',
      isHiddenFromPlayers: false,
    });
  };

  const handleAddShare = async () => {
    const email = addEmail.trim();
    if (!email) return;
    setBusy(true);
    setError('');
    try {
      const profile = await findProfileByEmail(email);
      if (!profile) {
        setError(`No account found for ${email} — they need to sign up first.`);
        return;
      }
      if (profile.id === currentUserId) {
        setError("That's your own account.");
        return;
      }
      await upsertShare(character.id, profile.id, addPermission);
      setAddEmail('');
      loadShares();
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const handleChangePermission = async (userId, permission) => {
    await upsertShare(character.id, userId, permission);
    loadShares();
  };

  const handleRemove = async (userId) => {
    await removeShare(character.id, userId);
    loadShares();
  };

  return (
    <Modal title="Share & Visibility" onClose={onClose}>
      <div className="space-y-5">
        <div>
          <div className="text-[10px] uppercase tracking-wider text-zinc-500 mb-1.5">Campaign</div>
          <select
            value={character.campaignId || ''}
            onChange={(e) => handleCampaignChange(e.target.value)}
            className="w-full bg-zinc-800 border border-zinc-700 rounded px-2 py-1.5 text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          >
            <option value="">Not attached to a campaign (private)</option>
            {campaigns.map((c) => (
              <option key={c.id} value={c.id}>{c.name}{c.dm_id === currentUserId ? ' (you DM)' : ''}</option>
            ))}
          </select>
          {attachedCampaign && (
            <p className="text-[11px] text-zinc-500 mt-1.5">Every member of "{attachedCampaign.name}" can view this character.</p>
          )}
          {isDmOfAttached && (
            <label className="flex items-center gap-2 mt-2.5 text-xs text-amber-300 cursor-pointer">
              <input
                type="checkbox"
                checked={!!character.isHiddenFromPlayers}
                onChange={(e) => onUpdateCharacter({ isHiddenFromPlayers: e.target.checked })}
                className="accent-amber-500"
              />
              <EyeOff className="w-3.5 h-3.5" /> Hide from players (only you can see this — good for NPCs)
            </label>
          )}
        </div>

        <div className="border-t border-zinc-800 pt-4">
          <div className="text-[10px] uppercase tracking-wider text-zinc-500 mb-2">People with direct access</div>
          {loading ? (
            <div className="text-xs text-zinc-600 italic">Loading…</div>
          ) : shares.length === 0 ? (
            <div className="text-xs text-zinc-600 italic mb-2">Not shared with anyone individually yet.</div>
          ) : (
            <div className="space-y-1.5 mb-2">
              {shares.map((s) => (
                <div key={s.user_id} className="flex items-center justify-between gap-2 bg-zinc-950 border border-zinc-800 rounded-lg px-2.5 py-1.5">
                  <div className="min-w-0">
                    <div className="text-sm text-zinc-200 truncate">{s.profiles?.display_name || 'Unknown'}</div>
                    <div className="text-[10px] text-zinc-500 truncate">{s.profiles?.email}</div>
                  </div>
                  <div className="flex items-center gap-1.5 shrink-0">
                    <select
                      value={s.permission}
                      onChange={(e) => handleChangePermission(s.user_id, e.target.value)}
                      className="bg-zinc-800 border border-zinc-700 rounded px-1.5 py-1 text-xs text-zinc-200 focus:outline-none"
                    >
                      <option value="view">Can view</option>
                      <option value="edit">Can edit</option>
                    </select>
                    <button onClick={() => handleRemove(s.user_id)} className="text-zinc-600 hover:text-red-400">
                      <X className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          <div className="flex items-center gap-1.5">
            <div className="relative flex-1">
              <Mail className="w-3.5 h-3.5 text-zinc-600 absolute left-2 top-1/2 -translate-y-1/2" />
              <input
                value={addEmail}
                onChange={(e) => setAddEmail(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handleAddShare(); } }}
                placeholder="friend@email.com"
                className="w-full bg-zinc-800 border border-zinc-700 rounded pl-7 pr-2 py-1.5 text-xs text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500"
              />
            </div>
            <select
              value={addPermission}
              onChange={(e) => setAddPermission(e.target.value)}
              className="bg-zinc-800 border border-zinc-700 rounded px-1.5 py-1.5 text-xs text-zinc-200 focus:outline-none"
            >
              <option value="view">Can view</option>
              <option value="edit">Can edit</option>
            </select>
            <button
              onClick={handleAddShare}
              disabled={busy}
              className="bg-emerald-700 hover:bg-emerald-600 disabled:opacity-50 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shrink-0"
            >
              Add
            </button>
          </div>
          {error && <div className="text-[11px] text-red-400 mt-1.5">{error}</div>}
        </div>
      </div>
    </Modal>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState('login'); // 'login' | 'signup'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [notice, setNotice] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    setNotice('');
    setBusy(true);
    try {
      if (mode === 'signup') {
        const { error: err } = await supabase.auth.signUp({ email: email.trim(), password });
        if (err) throw err;
        setNotice('Account created. If email confirmation is enabled on this project, check your inbox for a confirmation link before logging in.');
      } else {
        const { error: err } = await supabase.auth.signInWithPassword({ email: email.trim(), password });
        if (err) throw err;
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen bg-zinc-950 flex items-center justify-center p-4">
      <div className="w-full max-w-sm">
        <div className="flex items-center gap-2.5 justify-center mb-6">
          <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-600 to-violet-600 flex items-center justify-center">
            <BookOpen className="w-5 h-5 text-white" />
          </div>
          <h1 className="text-lg font-bold text-zinc-100">Homebrew Vault</h1>
        </div>
        <Card className="p-5">
          <div className="flex items-center gap-1 mb-4 bg-zinc-950 border border-zinc-800 rounded-lg p-1">
            <button
              onClick={() => setMode('login')}
              className={`flex-1 text-xs font-semibold py-1.5 rounded-md transition-colors ${mode === 'login' ? 'bg-emerald-600 text-white' : 'text-zinc-500'}`}
            >
              Log In
            </button>
            <button
              onClick={() => setMode('signup')}
              className={`flex-1 text-xs font-semibold py-1.5 rounded-md transition-colors ${mode === 'signup' ? 'bg-emerald-600 text-white' : 'text-zinc-500'}`}
            >
              Sign Up
            </button>
          </div>
          <form onSubmit={submit} className="space-y-3">
            <div>
              <div className="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">Email</div>
              <input
                type="email"
                required
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                className="w-full bg-zinc-800 border border-zinc-700 rounded px-2.5 py-1.5 text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500"
              />
            </div>
            <div>
              <div className="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">Password</div>
              <input
                type="password"
                required
                minLength={6}
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                className="w-full bg-zinc-800 border border-zinc-700 rounded px-2.5 py-1.5 text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500"
              />
            </div>
            {error && <div className="text-xs text-red-400 bg-red-950 border border-red-900 rounded px-2.5 py-1.5">{error}</div>}
            {notice && <div className="text-xs text-emerald-400 bg-emerald-950 border border-emerald-900 rounded px-2.5 py-1.5">{notice}</div>}
            <button
              type="submit"
              disabled={busy}
              className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-sm font-semibold py-2 rounded-lg transition-colors"
            >
              {busy ? 'Please wait…' : mode === 'signup' ? 'Create Account' : 'Log In'}
            </button>
          </form>
        </Card>
      </div>
    </div>
  );
}

function CampaignsModal({ campaigns, currentUserId, onRefresh, onClose }) {
  const [newName, setNewName] = useState('');
  const [joinCode, setJoinCode] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const handleCreate = async () => {
    const name = newName.trim();
    if (!name) return;
    setBusy(true);
    setError('');
    try {
      await createCampaign(name, currentUserId);
      setNewName('');
      await onRefresh();
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const handleJoin = async () => {
    if (!joinCode.trim()) return;
    setBusy(true);
    setError('');
    try {
      await joinCampaignByCode(joinCode);
      setJoinCode('');
      await onRefresh();
    } catch (e) {
      setError('Invalid invite code.');
    } finally {
      setBusy(false);
    }
  };

  return (
    <Modal title="Campaigns" onClose={onClose}>
      <div className="space-y-5">
        <div>
          <div className="text-[10px] uppercase tracking-wider text-zinc-500 mb-2">Your Campaigns</div>
          {campaigns.length === 0 ? (
            <div className="text-xs text-zinc-600 italic">You're not in any campaigns yet.</div>
          ) : (
            <div className="space-y-1.5">
              {campaigns.map((c) => {
                const isDm = c.dm_id === currentUserId;
                return (
                  <div key={c.id} className="flex items-center justify-between gap-2 bg-zinc-950 border border-zinc-800 rounded-lg px-2.5 py-2">
                    <div className="min-w-0">
                      <div className="text-sm text-zinc-200 truncate flex items-center gap-1.5">
                        {c.name}
                        {isDm && <Badge color="amber" size="xs">DM</Badge>}
                      </div>
                      {isDm && <div className="text-[10px] text-zinc-500 mt-0.5">Invite code: <span className="font-mono text-zinc-300">{c.invite_code}</span></div>}
                    </div>
                    {isDm && <CopyButton text={c.invite_code} label="Copy Code" icon={LinkIcon} />}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div className="border-t border-zinc-800 pt-4">
          <div className="text-[10px] uppercase tracking-wider text-zinc-500 mb-1.5">Create a Campaign (you'll be the DM)</div>

          </div>
        </div>

        <div className="border-t border-zinc-800 pt-4">
          <div className="text-[10px] uppercase tracking-wider text-zinc-500 mb-1.5">Join a Campaign</div>
          <div className="flex items-center gap-1.5">
            <input
              value={joinCode}
              onChange={(e) => setJoinCode(e.target.value)}
              placeholder="Invite code"
              className="flex-1 bg-zinc-800 border border-zinc-700 rounded px-2.5 py-1.5 text-sm text-zinc-100 font-mono focus:outline-none focus:ring-1 focus:ring-emerald-500"

              Join
            </button>
          </div>
        </div>
        {error && <div className="text-xs text-red-400">{error}</div>}
      </div>
    </Modal>
  );
