function ImportModal({ onClose, onImport, existingCharacters }) {
  const [error, setError] = useState('');
  const [showSchema, setShowSchema] = useState(false);
  const [pendingImport, setPendingImport] = useState(null); // { chars, collisions: [{incoming, existing}] }
  const fileRef = useRef(null);

  const parseFile = (file) => {
    setError('');
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        // Accept three shapes: a single character, a bare array of characters,
        // or a full vault backup { schemaVersion, characters: [...] }.
        let chars;
        if (Array.isArray(data)) {
          chars = data;
        } else if (data && Array.isArray(data.characters)) {
          chars = data.characters;
        } else {
          chars = [data];
        }
        if (chars.length === 0) throw new Error('No characters found in file.');
        for (const c of chars) {
          if (!isPlainObject(c) || !asString(c.name)) throw new Error('Missing required field: "name"');
        }
        const normalized = chars.map(normalizeImportedCharacter);

        const collisions = normalized
          .map((incoming) => ({ incoming, existing: existingCharacters.find((e) => e.name === incoming.name) }))
          .filter((pair) => pair.existing);

        if (collisions.length > 0) {
          setPendingImport({ chars: normalized, collisions });
        } else {
          onImport(normalized);
          onClose();
        }
      } catch (err) {
        setError('Could not parse file: ' + err.message);
      }
    };
    reader.readAsText(file);
  };

  const resolveImport = (mode) => {
    if (!pendingImport) return;
    const collisionNames = new Set(pendingImport.collisions.map((c) => c.existing.id));
    if (mode === 'replace') {
      onImport(pendingImport.chars, collisionNames);
    } else {
      // keep both: rename incoming duplicates so nothing is overwritten
      const renamed = pendingImport.chars.map((c) => {
        const isCollision = pendingImport.collisions.some((col) => col.incoming.id === c.id);
        return isCollision ? { ...c, name: c.name + ' (Imported)' } : c;
      });
      onImport(renamed);
    }
    setPendingImport(null);
    onClose();
  };

  if (pendingImport) {
    return (
      <Modal title="Name Conflicts Found" onClose={() => setPendingImport(null)} wide>
        <div className="space-y-4">
          <p className="text-sm text-zinc-300">
            {pendingImport.collisions.length} imported {pendingImport.collisions.length === 1 ? 'character shares' : 'characters share'} a name with an existing vault entry:
          </p>
          <ul className="space-y-1">
            {pendingImport.collisions.map((c) => (
              <li key={c.incoming.id} className="text-xs text-amber-300 bg-amber-950 border border-amber-900 rounded px-2 py-1">
                {c.incoming.name}
              </li>
            ))}
          </ul>
          <div className="flex items-center gap-2 pt-2">
            <button onClick={() => resolveImport('replace')} className="flex-1 bg-red-700 hover:bg-red-600 text-white text-sm font-semibold px-3 py-2 rounded-lg">
              Overwrite Existing
            </button>
            <button onClick={() => resolveImport('keep-both')} className="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white text-sm font-semibold px-3 py-2 rounded-lg">
              Keep Both (Rename Import)
            </button>
          </div>
        </div>
      </Modal>
    );
  }

  return (
    <Modal title="Import Character(s)" onClose={onClose} wide>
      <div className="space-y-4">
        <div
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); if (e.dataTransfer.files[0]) parseFile(e.dataTransfer.files[0]); }}
          onClick={() => fileRef.current?.click()}
          className="border-2 border-dashed border-zinc-700 hover:border-emerald-600 rounded-lg py-10 flex flex-col items-center justify-center gap-2 cursor-pointer text-zinc-500 hover:text-emerald-400 transition-colors"
        >
          <Upload className="w-8 h-8" />
          <span className="text-sm">Drop a .json file here, or click to browse</span>
          <span className="text-[10px] text-zinc-600">Accepts a single character, a list, or a full vault backup</span>
          <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={(e) => e.target.files[0] && parseFile(e.target.files[0])} />
        </div>
        {error && <div className="text-xs text-red-400 bg-red-950 border border-red-900 rounded px-3 py-2">{error}</div>}

        <button onClick={() => setShowSchema(!showSchema)} className="flex items-center gap-1.5 text-xs text-zinc-400 hover:text-zinc-200">
          <HelpCircle className="w-3.5 h-3.5" /> {showSchema ? 'Hide' : 'Show'} JSON schema (for humans or AI assistants)
        </button>
        {showSchema && (
          <div className="space-y-2">
            <p className="text-[11px] text-zinc-500">
              The comments below (<code className="text-zinc-400">// like this</code>) are explanatory and not valid JSON — an AI generating a real character file should omit them. Only <code className="text-zinc-400">"name"</code> is required; everything else is optional and defaults sensibly.
            </p>
            <pre className="bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-[10px] font-mono text-zinc-400 overflow-x-auto max-h-64">
              {SCHEMA_SNIPPET}
            </pre>
            <div className="flex items-center gap-2">
              <CopyButton text={SCHEMA_SNIPPET} label="Copy Schema" />
              <CopyButton text={AI_FILL_PROMPT} label="Copy AI Prompt" icon={Wand2} />
            </div>
          </div>
        )}
      </div>
    </Modal>
  );
}

function VaultView({ characters, onOpen, onCreate, onDuplicate, onImport, onDeleteCharacter, currentUserId, userEmail, campaigns, onRefreshCampaigns, onLogout }) {
  const [search, setSearch] = useState('');
  const [view, setView] = useState('grid');
  const [sortBy, setSortBy] = useState('lastEdited');
  const [activeTagFilters, setActiveTagFilters] = useState([]);
  const [ownerFilter, setOwnerFilter] = useState('all'); // 'all' | 'mine' | 'shared'
  const [showImport, setShowImport] = useState(false);
  const [showFilters, setShowFilters] = useState(false);
  const [showCampaigns, setShowCampaigns] = useState(false);

  const allTags = useMemo(() => {
    const s = new Set();
    characters.forEach((c) => c.tags.forEach((t) => s.add(t)));
    return Array.from(s).sort();
  }, [characters]);

  const campaignNameById = useMemo(() => Object.fromEntries(campaigns.map((c) => [c.id, c.name])), [campaigns]);

  const filtered = useMemo(() => {
    let list = characters.filter((c) => {
      const matchesSearch = !search || c.name.toLowerCase().includes(search.toLowerCase()) || c.role.toLowerCase().includes(search.toLowerCase());
      const matchesTags = activeTagFilters.length === 0 || activeTagFilters.every((t) => c.tags.includes(t));
      const matchesOwner = ownerFilter === 'all' || (ownerFilter === 'mine' ? c.ownerId === currentUserId : c.ownerId !== currentUserId);
      return matchesSearch && matchesTags && matchesOwner;
    });
    list.sort((a, b) => {
      if (sortBy === 'name') return a.name.localeCompare(b.name);
      if (sortBy === 'lastEdited') return b.lastEdited - a.lastEdited;
      if (sortBy === 'hp') return b.hp.max - a.hp.max;
      return 0;
    });
    return list;
  }, [characters, search, activeTagFilters, sortBy, ownerFilter, currentUserId]);

  const exportOne = (id) => {
    const c = characters.find((ch) => ch.id === id);
    if (!c) return;
    downloadJson({ ...c, schemaVersion: SCHEMA_VERSION }, `${c.name.replace(/[^a-z0-9]/gi, '_')}.json`);
  };

  const exportAll = () => {
    const mine = characters.filter((c) => c.ownerId === currentUserId);
    downloadJson(
      { schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(), characters: mine },
      `homebrew_vault_backup_${new Date().toISOString().slice(0, 10)}.json`
    );
  };

  const toggleTagFilter = (t) => {
    setActiveTagFilters((prev) => (prev.includes(t) ? prev.filter((x) => x !== t) : [...prev, t]));
  };

  return (
    <div className="min-h-screen bg-zinc-950">
      <div className="max-w-6xl mx-auto px-4 py-6">
        <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-600 to-violet-600 flex items-center justify-center">
              <BookOpen className="w-5 h-5 text-white" />
            </div>
            <div>
              <h1 className="text-lg font-bold text-zinc-100 leading-tight">Homebrew Vault</h1>
              <p className="text-[11px] text-zinc-500">{userEmail} · {characters.length} {characters.length === 1 ? 'entry' : 'entries'} visible to you</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <IconButton icon={Users} label="Campaigns" onClick={() => setShowCampaigns(true)} />
            <IconButton icon={Upload} label="Import" onClick={() => setShowImport(true)} />
            <IconButton icon={Download} label="Export Vault" onClick={exportAll} />
            <button onClick={onCreate} className="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-3.5 py-2 rounded-lg transition-colors">
              <Plus className="w-4 h-4" /> New Character
            </button>
            <IconButton icon={LogOut} label="" onClick={onLogout} />
          </div>
        </div>

        <div className="flex items-center gap-2 mb-4 flex-wrap">
          <div className="relative flex-1 min-w-[200px]">
            <Search className="w-4 h-4 text-zinc-600 absolute left-2.5 top-1/2 -translate-y-1/2" />
            <input
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search by name or role…"
              className="w-full bg-zinc-900 border border-zinc-800 rounded-lg pl-8 pr-3 py-2 text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-emerald-500"
            />
          </div>
          <select
            value={ownerFilter}
            onChange={(e) => setOwnerFilter(e.target.value)}
            className="bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-xs text-zinc-300 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          >
            <option value="all">Everyone's</option>
            <option value="mine">Mine only</option>
            <option value="shared">Shared with me</option>
          </select>
          <select
            value={sortBy}
            onChange={(e) => setSortBy(e.target.value)}
            className="bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-xs text-zinc-300 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          >
            <option value="lastEdited">Sort: Last Edited</option>
            <option value="name">Sort: Name</option>
            <option value="hp">Sort: Max HP</option>
          </select>
          <button
            onClick={() => setShowFilters(!showFilters)}
            className={`flex items-center gap-1.5 px-2.5 py-2 rounded-lg text-xs font-medium border ${activeTagFilters.length > 0 ? 'bg-emerald-950 border-emerald-800 text-emerald-400' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`}
          >
            <Filter className="w-3.5 h-3.5" /> Tags {activeTagFilters.length > 0 && `(${activeTagFilters.length})`}
          </button>
          <div className="flex items-center bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden">
            <button onClick={() => setView('grid')} className={`p-2 ${view === 'grid' ? 'bg-zinc-700 text-white' : 'text-zinc-500'}`}><Grid3x3 className="w-4 h-4" /></button>
            <button onClick={() => setView('list')} className={`p-2 ${view === 'list' ? 'bg-zinc-700 text-white' : 'text-zinc-500'}`}><List className="w-4 h-4" /></button>
          </div>
        </div>

        {showFilters && allTags.length > 0 && (
          <div className="mb-4 p-3 bg-zinc-900 border border-zinc-800 rounded-lg">
            <ChipSelect options={allTags} selected={activeTagFilters} onToggle={toggleTagFilter} color="emerald" />
          </div>
        )}

        {filtered.length === 0 ? (
          <div className="text-center py-20 text-zinc-600">
            <FolderOpen className="w-10 h-10 mx-auto mb-3 opacity-50" />
            <p className="text-sm">{characters.length === 0 ? 'No characters yet. Create one or import a JSON file to get started.' : 'No entries match your search or filters.'}</p>
          </div>
        ) : (
          <div className={view === 'grid' ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3' : 'flex flex-col gap-2'}>
            {filtered.map((c) => (
              <CharacterCard
                key={c.id}
                character={c}
                view={view}
                isOwner={c.ownerId === currentUserId}
                campaignName={c.campaignId ? campaignNameById[c.campaignId] : null}
                onOpen={() => onOpen(c.id)}
                onDuplicate={() => onDuplicate(c.id)}
                onExport={() => exportOne(c.id)}
                onDelete={() => onDeleteCharacter(c.id)}
              />
            ))}
          </div>
        )}
      </div>

      {showImport && (
        <ImportModal
          onClose={() => setShowImport(false)}
          existingCharacters={characters}
          onImport={onImport}
        />
      )}

      {showCampaigns && (
        <CampaignsModal
          campaigns={campaigns}
          currentUserId={currentUserId}
          onRefresh={onRefreshCampaigns}
          onClose={() => setShowCampaigns(false)}
        />
      )}
    </div>
  );
}

// ============================================================
// ROOT APP
// ============================================================

function HomebrewVaultApp() {
  // undefined = auth state not yet known, null = logged out, object = logged in
  const [session, setSession] = useState(undefined);
  const [characters, setCharacters] = useState([]);
  const [campaigns, setCampaigns] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [dataLoading, setDataLoading] = useState(false);
  const [loadError, setLoadError] = useState(null);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supabase.auth.onAuthStateChange((_event, newSession) => setSession(newSession));
    return () => sub.subscription.unsubscribe();
  }, []);

  const refreshCampaigns = async () => {
    try {
      setCampaigns(await fetchCampaigns());
    } catch (e) { /* non-critical, leave prior list in place */ }
  };

  useEffect(() => {
    if (!session) {
      setCharacters([]);
      setCampaigns([]);
      setActiveId(null);
      return;
    }
    setDataLoading(true);
    setLoadError(null);
    Promise.all([
      fetchCharacters().then(setCharacters),
      fetchCampaigns().then(setCampaigns),
    ])
      .catch((e) => setLoadError(e.message))
      .finally(() => setDataLoading(false));

    // Restore whichever character was open last time, on this device.
    try {
      const savedId = localStorage.getItem(LAST_OPEN_KEY);
      if (savedId) setActiveId(savedId);
    } catch (e) { /* storage unavailable */ }
  }, [session]);

  useEffect(() => {
    try {
      if (activeId) localStorage.setItem(LAST_OPEN_KEY, activeId);
      else localStorage.removeItem(LAST_OPEN_KEY);
    } catch (e) { /* storage unavailable */ }
  }, [activeId]);

  const activeCharacter = characters.find((c) => c.id === activeId);

  const updateActiveCharacter = async (updated) => {
    setCharacters((prev) => prev.map((c) => (c.id === updated.id ? updated : c)));
    try {
      await updateCharacterRow(updated);
    } catch (e) {
      setLoadError('Could not save your last change: ' + e.message);
    }
  };

  const exportActive = () => {
    if (!activeCharacter) return;
    downloadJson({ ...activeCharacter, schemaVersion: SCHEMA_VERSION }, `${activeCharacter.name.replace(/[^a-z0-9]/gi, '_')}.json`);
  };

  const createNew = async () => {
    try {
      const row = await insertCharacterRow(createBlankCharacter(), session.user.id);
      setCharacters((prev) => [row, ...prev]);
      setActiveId(row.id);
    } catch (e) {
      setLoadError(e.message);
    }
  };

  // Returns the new row so callers can decide whether to navigate to it.
  const duplicateCharacter = async (id) => {
    const orig = characters.find((c) => c.id === id);
    if (!orig) return null;
    const copy = {
      ...cloneCharacterWithFreshIds(orig),
      name: orig.name + ' (Copy)',
      campaignId: null,
      visibility: 'private',
      isHiddenFromPlayers: false,
    };
    try {
      const row = await insertCharacterRow(copy, session.user.id);
      setCharacters((prev) => [row, ...prev]);
      return row;
    } catch (e) {
      setLoadError(e.message);
      return null;
    }
  };

  const duplicateActive = async () => {
    if (!activeCharacter) return;
    const row = await duplicateCharacter(activeCharacter.id);
    if (row) setActiveId(row.id);
  };

  const handleImport = async (newChars, replaceIds) => {
    try {
      if (replaceIds && replaceIds.size > 0) {
        await Promise.all([...replaceIds].map((id) => deleteCharacterRow(id)));
      }
      const inserted = await Promise.all(newChars.map((nc) => insertCharacterRow(nc, session.user.id)));
      setCharacters((prev) => [...inserted, ...prev.filter((c) => !replaceIds || !replaceIds.has(c.id))]);
    } catch (e) {
      setLoadError(e.message);
    }
  };

  // Undo-aware delete: removes immediately (and on the server) but keeps the
  // character + its original index around briefly so a misclick can be
  // reversed by re-inserting it with the same id.
  const [pendingDelete, setPendingDelete] = useState(null); // { character, index }

  const deleteCharacterWithUndo = async (id) => {
    const index = characters.findIndex((c) => c.id === id);
    if (index === -1) return;
    const removed = characters[index];
    setCharacters((prev) => prev.filter((c) => c.id !== id));
    if (activeId === id) setActiveId(null);
    try {
      await deleteCharacterRow(id);
      setPendingDelete({ character: removed, index });
    } catch (e) {
      // Delete failed server-side (e.g. not the owner) — put it back locally.
      setCharacters((prev) => {
        const next = [...prev];
        next.splice(Math.min(index, next.length), 0, removed);
        return next;
      });
      setLoadError(e.message);
    }
  };

  const undoDelete = async () => {
    if (!pendingDelete) return;
    try {
      const row = await insertCharacterRow(pendingDelete.character, session.user.id, { preserveId: true });
      setCharacters((prev) => {
        const next = [...prev];
        next.splice(Math.min(pendingDelete.index, next.length), 0, row);
        return next;
      });
    } catch (e) {
      setLoadError(e.message);
    }
    setPendingDelete(null);
  };

  const deleteActive = () => {
    if (!activeCharacter) return;
    deleteCharacterWithUndo(activeCharacter.id);
  };

  const handleLogout = () => supabase.auth.signOut();

  const globalStyle = (
    <style>{`
      /* Font strategy: try Inter/JetBrains Mono if the machine already has
         them (or a connection to fetch them), but never depend on network
         access — the stack falls back to quality system fonts that render
         almost identically, so this works fully offline. */
      * { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #18181b; }
      ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #52525b; }
      input[type=number]::-webkit-inner-spin-button { opacity: 1; }
      .print-only { display: none; }
      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body, .bg-zinc-950 { background: white !important; }
      }
    `}</style>
  );

  if (session === undefined) {
    return (
      <div className="font-sans antialiased min-h-screen bg-zinc-950 flex items-center justify-center text-zinc-500 text-sm">
        {globalStyle}
        Loading…
      </div>
    );
  }

  if (!session) {
    return (
      <div className="font-sans antialiased">
        {globalStyle}
        <AuthScreen />
      </div>
    );
  }

  return (
    <div className="font-sans antialiased">
      {globalStyle}
      {loadError && (
        <div className="sticky top-0 z-40 bg-red-950 border-b border-red-800 px-4 py-2 flex items-center justify-center gap-2 text-xs text-red-300">
          <span>{loadError}</span>
          <button onClick={() => setLoadError(null)} className="font-semibold underline hover:text-red-100">Dismiss</button>
        </div>
      )}
      {dataLoading ? (
        <div className="min-h-screen flex items-center justify-center text-zinc-500 text-sm">Loading your vault…</div>
      ) : activeCharacter ? (
        <CharacterEditor
          character={activeCharacter}
          onUpdate={updateActiveCharacter}
          onBack={() => setActiveId(null)}
          onExport={exportActive}
          onDuplicate={duplicateActive}
          onDelete={deleteActive}
          currentUserId={session.user.id}
          campaigns={campaigns}
          isOwner={activeCharacter.ownerId === session.user.id}
          canEdit={activeCharacter.ownerId === session.user.id || activeCharacter.canEditByShare}
        />
      ) : (
        <VaultView
          characters={characters}
          onOpen={setActiveId}
          onCreate={createNew}
          onDuplicate={duplicateCharacter}
          onImport={handleImport}
          onDeleteCharacter={deleteCharacterWithUndo}
          currentUserId={session.user.id}
          userEmail={session.user.email}
          campaigns={campaigns}
          onRefreshCampaigns={refreshCampaigns}
          onLogout={handleLogout}
        />
      )}
      {pendingDelete && (
        <UndoToast
          message={`Deleted "${pendingDelete.character.name}"`}
          onUndo={undoDelete}
          onDismiss={() => setPendingDelete(null)}
        />
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<HomebrewVaultApp />);
</script>
<script type="module" src="/src/main.tsx"></script>
